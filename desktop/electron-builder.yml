# The Mac app: `bun run bridge` stages bundle/ first, and release.yml passes the version
# (-c.extraMetadata.version). docs/desktop.md says how it is built and released.
appId: com.alexanderkreidich.t-rex
productName: T-Rex
copyright: Copyright © 2026 Alexander Kreidich
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: bundle
    to: bridge
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: ../public/icons/icon-512.png
  target: [dmg, zip]
  artifactName: t-rex-${version}-${arch}.${ext}
  # No Developer ID yet: signed ad-hoc, and without the hardened runtime, which would refuse
  # Electron's own frameworks under an ad-hoc signature.
  identity: "-"
  hardenedRuntime: false
